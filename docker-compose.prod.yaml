
services:
  nginx_prod:
    image: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${PWD}/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ${PWD}/nginx/www:/data/www
      - ${PATH_TO_CERTS}:/etc/nginx/ssl
    profiles:
      - prod
    command: >
      /bin/sh -c "chmod -R 755 /data/www &&
                  chmod -R a+r /data/www &&
                  nginx -g 'daemon off;'"

  flight:
    build: ./flight_info
    environment:
      - API_KEY=${API_KEY}
      - API_ENDPOINT=${API_ENDPOINT}
  
  chat:
    build: ./chatbot
    environment:
      - API_KEY=${API_KEY}
      - API_ENDPOINT=${API_ENDPOINT}

  ocr:
    build: ./ocr
    environment:
      - API_KEY=${API_KEY}
      - API_ENDPOINT=${API_ENDPOINT}

  healthcare:
    build: ./healthcare
    environment:
      - API_KEY=${API_KEY}
      - API_ENDPOINT=${API_ENDPOINT}